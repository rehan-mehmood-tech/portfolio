services:
  - type: web
    name: rehan-portfolio-agent
    runtime: python
    rootDir: services/agent-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: WEB_INTERNAL_API_KEY
        sync: false
      - key: WEB_LEADS_URL
        sync: false
